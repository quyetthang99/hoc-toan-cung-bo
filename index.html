<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Toán Cùng Bố</title>
    <style>
        :root { --primary: #ff6b6b; --bg: #ffeaa7; --correct: #1dd1a1; --text: #2d3436; }
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; margin: 0; color: var(--text); }
        .app-container { background: white; padding: 2.5rem 2rem; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 650px; text-align: center; border: 6px solid #74b9ff; }
        
        h1 { color: #0984e3; font-size: 2.5rem; margin-top: 0; margin-bottom: 5px; }
        .subtitle { color: #e17055; font-size: 1.3rem; font-weight: bold; margin-bottom: 30px; }
        
        .score-board { background: #81ecec; padding: 15px 25px; border-radius: 15px; display: flex; justify-content: space-between; font-size: 1.4rem; font-weight: bold; color: #2d3436; margin-bottom: 35px; border: 2px dashed #00cec9; }
        
        /* CỘT TOÁN NGANG 2 SỐ */
        .equation-horiz { font-size: 4.5rem; font-weight: bold; color: #d63031; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        
        /* CỘT TOÁN NGANG 3 SỐ CÓ NHÁP CHỮ V */
        .grid-3num { display: grid; grid-template-columns: auto auto auto auto auto auto auto; gap: 10px; font-size: 4rem; font-weight: bold; color: #d63031; align-items: center; justify-content: center; margin-bottom: 20px; }
        .scratch-wrapper { grid-column: 1 / 4; display: flex; flex-direction: column; align-items: center; margin-top: -10px; }
        .v-branch { width: 60%; height: 25px; border-left: 5px solid #74b9ff; border-right: 5px solid #74b9ff; border-bottom: 5px solid #74b9ff; border-radius: 0 0 15px 15px; margin-bottom: 15px; }
        
        /* CỘT TOÁN DỌC (ĐẶT TÍNH RỒI TÍNH) */
        .vert-grid { display: grid; grid-template-columns: 40px 65px 65px; gap: 5px; align-items: center; justify-items: center; font-size: 4.5rem; font-weight: bold; color: #d63031; margin: 0 auto 20px auto; width: max-content; }
        .vert-op { grid-column: 1; justify-self: end; color: #0984e3; }
        .vert-line { grid-column: 1 / span 3; width: 100%; height: 6px; background: #2d3436; border-radius: 3px; margin: 5px 0 10px 0; }

        /* GIAO DIỆN CHUNG CHO 2 Ô NHẬP LIỆU (CHỤC & ĐƠN VỊ) */
        .input-pair { display: inline-flex; gap: 8px; }
        .digit-box { width: 60px; height: 80px; font-size: 3.5rem; text-align: center; border: 5px dashed #0984e3; border-radius: 15px; color: #0984e3; font-family: inherit; font-weight: bold; outline: none; background: #fafafa; transition: 0.2s; }
        .digit-box:focus { border-style: solid; background: #e0f7fa; transform: scale(1.05); }
        .digit-box::-webkit-inner-spin-button, .digit-box::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Ô nháp màu vàng nhỏ hơn một chút */
        .scratch-box { border-color: #fdcb6e; color: #e17055; background: #fff9e6; height: 70px; width: 55px; font-size: 3rem; }
        .scratch-box:focus { background: #fff2cc; border-color: #f39c12; }
        
        /* Nút bấm */
        .btn-check { margin-top: 10px; padding: 18px 40px; font-size: 2rem; background: #fdcb6e; color: #d63031; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #e17055; transition: 0.1s; font-family: inherit; width: 100%; }
        .btn-check:active { transform: translateY(6px); box-shadow: 0 0 0 #e17055; }
        
        /* Hiệu ứng đúng/sai */
        .feedback { font-size: 1.8rem; font-weight: bold; min-height: 50px; margin-top: 20px; }
        .correct-text { color: var(--correct); animation: bounce 0.5s ease; }
        .wrong-text { color: var(--primary); animation: shake 0.5s ease; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-15px); } 75% { transform: translateX(15px); } }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🎈 Học Toán Cùng Bố 🎈</h1>
    <div class="subtitle">Tính hàng đơn vị trước, hàng chục sau nhé! 🚀</div>

    <div class="score-board">
        <span>🌟 Câu số: <span id="question-count" style="color:#d63031">1</span></span>
        <span>✅ Đúng: <span id="score" style="color:#1dd1a1">0</span></span>
    </div>

    <div id="question-area">Đang tải...</div>

    <div class="feedback" id="feedback"></div>

    <button class="btn-check" id="check-btn" onclick="checkAnswer()">Kiểm tra!</button>
</div>

<script>
    let currentAnswer = 0;
    let score = 0;
    let questionCount = 1;
    let typeBag = []; 

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function splitDigits(num) {
        if (num < 10) return ['', num]; 
        return [Math.floor(num / 10), num % 10];
    }

    function getNextMathType() {
        if (typeBag.length === 0) {
            typeBag = ["add_2", "sub_2", "add_3", "sub_3", "mix_3", "vert_add_2", "vert_sub_2"];
            for (let i = typeBag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [typeBag[i], typeBag[j]] = [typeBag[j], typeBag[i]];
            }
        }
        return typeBag.pop();
    }

    function generateQuestion() {
        const type = getNextMathType();
        let htmlStr = "";
        let num1, num2, num3;

        // 1. DẠNG TOÁN DỌC (ĐẶT TÍNH RỒI TÍNH)
        if (type.includes("vert")) {
            let opStr = "+";
            if (type === "vert_add_2") {
                num1 = rand(10, 89); num2 = rand(10, 99 - num1); currentAnswer = num1 + num2; opStr = "+";
            } else {
                num1 = rand(20, 99); num2 = rand(10, num1); currentAnswer = num1 - num2; opStr = "-";
            }
            let [t1, u1] = splitDigits(num1);
            let [t2, u2] = splitDigits(num2);

            htmlStr = `
                <div class="vert-grid">
                    <div></div> <div>${t1}</div> <div>${u1}</div>
                    <div class="vert-op">${opStr}</div> <div>${t2}</div> <div>${u2}</div>
                    <div class="vert-line"></div>
                    <div></div>
                    <input type="text" id="ans-tens" class="digit-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, null)" onkeydown="handleDelete(event, 'ans-units')" onkeypress="handleEnter(event)">
                    <input type="text" id="ans-units" class="digit-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, 'ans-tens')" onkeypress="handleEnter(event)">
                </div>
            `;
        } 
        // 2. DẠNG TOÁN NGANG 3 SỐ (CÓ Ô NHÁP CHỮ V)
        else if (type === "add_3" || type === "sub_3" || type === "mix_3") {
            let op1, op2;
            if (type === "add_3") {
                num1 = rand(1, 40); num2 = rand(1, 40); num3 = rand(1, 99 - num1 - num2); currentAnswer = num1 + num2 + num3; op1 = "+"; op2 = "+";
            } else if (type === "sub_3") {
                num1 = rand(30, 99); num2 = rand(1, num1 - 10); num3 = rand(1, num1 - num2); currentAnswer = num1 - num2 - num3; op1 = "-"; op2 = "-";
            } else if (type === "mix_3") {
                num1 = rand(1, 50); num2 = rand(1, 49); num3 = rand(1, num1 + num2); currentAnswer = num1 + num2 - num3; op1 = "+"; op2 = "-";
            }

            htmlStr = `
                <div class="grid-3num">
                    <div>${num1}</div> <div>${op1}</div> <div>${num2}</div>
                    <div>${op2}</div> <div>${num3}</div> <div>=</div>
                    <div class="input-pair">
                        <input type="text" id="ans-tens" class="digit-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, null)" onkeydown="handleDelete(event, 'ans-units')" onkeypress="handleEnter(event)">
                        <input type="text" id="ans-units" class="digit-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, 'ans-tens')" onkeypress="handleEnter(event)">
                    </div>
                    
                    <div class="scratch-wrapper">
                        <div class="v-branch"></div>
                        <div class="input-pair">
                            <input type="text" id="scratch-tens" class="digit-box scratch-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, 'ans-units')" onkeydown="handleDelete(event, 'scratch-units')" onkeypress="handleScratchEnter(event)">
                            <input type="text" id="scratch-units" class="digit-box scratch-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, 'scratch-tens')" onkeypress="handleScratchEnter(event)">
                        </div>
                    </div>
                </div>
            `;
        }
        // 3. DẠNG TOÁN NGANG 2 SỐ BÌNH THƯỜNG
        else {
            let qText = "";
            if (type === "add_2") {
                num1 = rand(1, 89); num2 = rand(1, 99 - num1); currentAnswer = num1 + num2; qText = `${num1} + ${num2} = `;
            } else if (type === "sub_2") {
                num1 = rand(10, 99); num2 = rand(1, num1); currentAnswer = num1 - num2; qText = `${num1} - ${num2} = `;
            }
            htmlStr = `
                <div class="equation-horiz">
                    <span>${qText}</span>
                    <div class="input-pair">
                        <input type="text" id="ans-tens" class="digit-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, null)" onkeydown="handleDelete(event, 'ans-units')" onkeypress="handleEnter(event)">
                        <input type="text" id="ans-units" class="digit-box" inputmode="numeric" maxlength="1" oninput="handleTyping(this, 'ans-tens')" onkeypress="handleEnter(event)">
                    </div>
                </div>
            `;
        }

        document.getElementById('question-area').innerHTML = htmlStr;
        document.getElementById('feedback').innerText = '';
        
        // Luôn luôn ưu tiên Focus vào Hàng Đơn Vị (Của ô Nháp trước, nếu không có nháp thì ô Kết quả)
        setTimeout(() => { 
            if (document.getElementById('scratch-units')) {
                document.getElementById('scratch-units').focus(); 
            } else {
                document.getElementById('ans-units').focus(); 
            }
        }, 50);
    }

    // Tự động nhảy sang ô Hàng chục (bên trái) khi gõ xong Hàng đơn vị
    function handleTyping(currentInput, nextId) {
        currentInput.value = currentInput.value.replace(/[^0-9]/g, ''); 
        if (currentInput.value.length === 1 && nextId) {
            document.getElementById(nextId).focus();
        }
    }

    // Tự động lùi về ô Hàng đơn vị (bên phải) nếu đang ở Hàng chục mà bấm nút Xóa
    function handleDelete(event, prevId) {
        if (event.key === "Backspace" && event.target.value === '') {
            event.preventDefault();
            document.getElementById(prevId).focus();
        }
    }

    // Khi gõ xong Hàng chục của ô Nháp, bấm Enter sẽ tự động bay sang ô Đơn Vị của Kết Quả
    function handleScratchEnter(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            document.getElementById('ans-units').focus();
        }
    }

    function checkAnswer() {
        const feedback = document.getElementById('feedback');
        
        const tInput = document.getElementById('ans-tens');
        const uInput = document.getElementById('ans-units');
        const tVal = tInput.value;
        const uVal = uInput.value;

        // Nếu cả 2 ô đáp án chính đều trống
        if (tVal === '' && uVal === '') {
            feedback.innerHTML = `<span class="wrong-text">Bé chưa điền kết quả kìa! 🤔</span>`;
            uInput.focus();
            return;
        }

        // Ghép số lại (Nếu ô hàng chục trống thì hiểu là số 0, VD: ô chục trống, ô đơn vị 5 -> 05 -> 5)
        const userAnswer = parseInt((tVal || '0') + (uVal || '0'), 10);

        if (userAnswer === currentAnswer) {
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerHTML = `<span class="correct-text">Giỏi quá! Bé tính đúng rồi! 🎉</span>`;
            
            setTimeout(() => {
                questionCount++;
                document.getElementById('question-count').innerText = questionCount;
                generateQuestion();
            }, 1500);
        } else {
            feedback.innerHTML = `<span class="wrong-text">Nhầm chút xíu. Bé tính lại nhé! ❌</span>`;
            
            // Nếu tính sai, hệ thống giữ nguyên ô nháp (để bé xem lại) nhưng xóa ô kết quả
            tInput.value = '';
            uInput.value = '';
            uInput.focus(); // Đưa nháy chuột về lại ô Hàng Đơn Vị để bé làm lại
        }
    }

    // Bấm Enter để nộp bài
    function handleEnter(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            checkAnswer();
        }
    }

    function startNewGame() {
        score = 0;
        questionCount = 1;
        typeBag = []; 
        document.getElementById('score').innerText = score;
        document.getElementById('question-count').innerText = questionCount;
        generateQuestion();
    }

    window.onload = startNewGame;
</script>
</body>
</html>
