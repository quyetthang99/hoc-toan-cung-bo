<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Toán Cùng Bố</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 5px solid #bbf7d0;
        }
        h1 {
            color: #f59e0b;
            font-size: 2.5em;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fef3c7;
        }
        .modes {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 10px 15px;
            border: 2px solid transparent;
            border-radius: 20px;
            background: #e2e8f0;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            color: #475569;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #f59e0b;
            color: white;
            border-color: #d97706;
            box-shadow: 0 4px 0 #d97706;
            transform: translateY(-2px);
        }
        .question-box {
            background: #e0f2fe;
            padding: 25px 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.8em;
            color: #0369a1;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #7dd3fc;
            line-height: 1.4;
        }
        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            font-size: 2em;
            padding: 10px;
            width: 120px;
            text-align: center;
            border: 4px solid #cbd5e1;
            border-radius: 15px;
            outline: none;
            color: #1e293b;
            font-family: inherit;
        }
        input[type="number"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.4em;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
            box-shadow: 0 6px 0 #16a34a;
        }
        .btn:hover { background: #16a34a; transform: translateY(2px); box-shadow: 0 4px 0 #15803d; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #15803d; }
        
        .btn-next { background: #3b82f6; box-shadow: 0 6px 0 #2563eb; display: none; }
        .btn-next:hover { background: #2563eb; box-shadow: 0 4px 0 #1d4ed8; }
        .btn-next:active { box-shadow: 0 0 0 #1d4ed8; }

        .feedback {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }
        .score-board {
            font-size: 1.3em;
            color: #ef4444;
            font-weight: bold;
            margin-top: 20px;
            background: #fee2e2;
            padding: 10px;
            border-radius: 15px;
            display: inline-block;
        }
        /* Pháo hoa */
        .confetti { position: fixed; z-index: 9999; pointer-events: none; transition: all 1.5s ease-out; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎈 Làm Toán Cùng Bố 🎈</h1>
        
        <div class="modes">
            <button class="mode-btn active" onclick="setMode('all', this)">Trộn lẫn</button>
            <button class="mode-btn" onclick="setMode('basic', this)">Cộng Trừ</button>
            <button class="mode-btn" onclick="setMode('missing', this)">Tìm số (X)</button>
            <button class="mode-btn" onclick="setMode('word', this)">Toán đố</button>
        </div>

        <div class="question-box" id="question">Đang tải câu hỏi...</div>

        <div class="input-area">
            <input type="number" id="answer" placeholder="?" onkeypress="handleEnter(event)">
        </div>

        <button class="btn" id="btn-submit" onclick="checkAnswer()">Trả lời nhé!</button>
        <button class="btn btn-next" id="btn-next" onclick="generateQuestion()">Câu tiếp theo ➔</button>

        <div class="feedback" id="feedback"></div>
        <div class="score-board">Điểm của con: ⭐ <span id="score">0</span></div>
    </div>

    <script>
        let score = 0;
        let currentAnswer = 0;
        let currentMode = 'all';

        // Hàm tiện ích tạo số ngẫu nhiên
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function setMode(mode, btnElement) {
            currentMode = mode;
            // Đổi màu nút
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            generateQuestion();
            document.getElementById('answer').focus();
        }

        function generateQuestion() {
            // Reset giao diện
            document.getElementById('answer').value = '';
            document.getElementById('answer').disabled = false;
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('btn-submit').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('answer').focus();
            
            let type = currentMode;
            if (type === 'all') {
                const types = ['basic', 'missing', 'missing3', 'word_add', 'word_sub'];
                type = types[Math.floor(Math.random() * types.length)];
            } else if (type === 'word') {
                type = Math.random() > 0.5 ? 'word_add' : 'word_sub';
            } else if (type === 'missing') {
                type = Math.random() > 0.5 ? 'missing' : 'missing3';
            }

            let qText = '';
            
            if (type === 'basic') {
                let a = getRandomInt(10, 80);
                let b = getRandomInt(10, 50);
                if (Math.random() > 0.5) {
                    currentAnswer = a + b;
                    qText = `${a} + ${b} = ?`;
                } else {
                    if (a < b) [a, b] = [b, a]; // Đảm bảo a lớn hơn b để trừ không ra số âm
                    currentAnswer = a - b;
                    qText = `${a} - ${b} = ?`;
                }
            } 
            else if (type === 'missing') {
                // Dạng: A + ... = C  hoặc  ... + B = C
                let a = getRandomInt(10, 50);
                let ans = getRandomInt(5, 40);
                let c = a + ans;
                currentAnswer = ans;
                if (Math.random() > 0.5) {
                    qText = `${a} + ... = ${c}`;
                } else {
                    qText = `... + ${a} = ${c}`;
                }
            }
            else if (type === 'missing3') {
                // Dạng: 12 + ... + 25 = 49
                let a = getRandomInt(10, 30);
                let b = getRandomInt(10, 30);
                let ans = getRandomInt(5, 20);
                let c = a + b + ans;
                currentAnswer = ans;
                qText = `${a} + ... + ${b} = ${c}`;
            }
            else if (type.startsWith('word')) {
                // Ngân hàng từ vựng cho bài toán đố
                const names = ["Nga", "Linh", "Minh", "Lan", "Hải", "An", "Bảo", "Chi"];
                const items = ["quả cam", "quả táo", "viên bi", "cái kẹo", "quyển vở", "bông hoa"];
                
                let n1 = names[getRandomInt(0, names.length-1)];
                let n2 = names[getRandomInt(0, names.length-1)];
                while(n1 === n2) n2 = names[getRandomInt(0, names.length-1)];
                let item = items[getRandomInt(0, items.length-1)];
                
                if (type === 'word_add') {
                    let a = getRandomInt(10, 30);
                    let b = getRandomInt(5, 25);
                    currentAnswer = a + b;
                    qText = `Bạn ${n1} có ${a} ${item}, bạn ${n2} có ${b} ${item}. Hỏi cả hai bạn có tất cả bao nhiêu ${item}?`;
                } else {
                    let a = getRandomInt(20, 50);
                    let b = getRandomInt(5, a-5); // Đảm bảo số cho đi nhỏ hơn số ban đầu
                    currentAnswer = a - b;
                    qText = `Bạn ${n1} có ${a} ${item}. ${n1} cho bạn ${n2} ${b} ${item}. Hỏi ${n1} còn lại bao nhiêu ${item}?`;
                }
            }

            document.getElementById('question').innerText = qText;
        }

        function checkAnswer() {
            let userAnswer = parseInt(document.getElementById('answer').value);
            let feedbackEl = document.getElementById('feedback');
            
            if (isNaN(userAnswer)) {
                feedbackEl.innerText = "Con hãy nhập một số nhé! 🤔";
                feedbackEl.style.color = "#f59e0b";
                return;
            }

            if (userAnswer === currentAnswer) {
                feedbackEl.innerText = "Chính xác! Hoan hô con! 🎉";
                feedbackEl.style.color = "#16a34a";
                score += 10;
                document.getElementById('score').innerText = score;
                document.getElementById('answer').disabled = true; // Khóa ô nhập
                
                // Đổi nút
                document.getElementById('btn-submit').style.display = 'none';
                document.getElementById('btn-next').style.display = 'inline-block';
                document.getElementById('btn-next').focus();

                shootConfetti(); // Bắn pháo hoa
            } else {
                feedbackEl.innerText = "Chưa đúng rồi, con tính lại thử xem! 💪";
                feedbackEl.style.color = "#ef4444";
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
                
                // Trừ điểm nhẹ nếu sai để bé cẩn thận hơn (không trừ xuống dưới 0)
                if (score > 0) score -= 2;
                document.getElementById('score').innerText = score;
            }
        }

        // Bấm Enter để nộp bài
        function handleEnter(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('btn-submit').style.display !== 'none') {
                    checkAnswer();
                }
            }
        }

        // Hiệu ứng pháo hoa vui nhộn không cần dùng thư viện ngoài
        function shootConfetti() {
            const emojis = ['🌟', '⭐', '✨', '🎉', '🎊', '🍎', '🎈', '🏆'];
            for(let i = 0; i < 20; i++) {
                let el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.className = 'confetti';
                
                // Vị trí bắt đầu ở dưới màn hình
                el.style.left = (Math.random() * 100) + 'vw';
                el.style.top = '100vh';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                
                document.body.appendChild(el);
                
                // Bay lên và xoay
                setTimeout(() => {
                    el.style.top = '-' + (Math.random() * 20 + 10) + 'vh';
                    el.style.transform = `rotate(${Math.random() * 720 - 360}deg)`;
                }, 50);
                
                // Xóa khỏi DOM sau khi bay xong
                setTimeout(() => el.remove(), 1500);
            }
        }

        // Bắt đầu game khi tải trang
        window.onload = generateQuestion;
    </script>
</body>
</html>
