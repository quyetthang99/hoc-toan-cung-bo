<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Toán Cùng Bố</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 650px;
            width: 100%;
            border: 5px solid #bbf7d0;
        }
        h1 {
            color: #f59e0b;
            font-size: 2.5em;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fef3c7;
        }
        .modes {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 10px 15px;
            border: 2px solid transparent;
            border-radius: 20px;
            background: #e2e8f0;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            color: #475569;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #f59e0b;
            color: white;
            border-color: #d97706;
            box-shadow: 0 4px 0 #d97706;
            transform: translateY(-2px);
        }
        .question-box {
            background: #e0f2fe;
            padding: 25px 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.8em;
            color: #0369a1;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #7dd3fc;
            line-height: 1.4;
        }
        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            font-size: 2em;
            padding: 10px;
            width: 120px;
            text-align: center;
            border: 4px solid #cbd5e1;
            border-radius: 15px;
            outline: none;
            color: #1e293b;
            font-family: inherit;
        }
        input[type="number"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.4em;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
            box-shadow: 0 6px 0 #16a34a;
        }
        .btn:hover { background: #16a34a; transform: translateY(2px); box-shadow: 0 4px 0 #15803d; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #15803d; }
        
        .btn-next { background: #3b82f6; box-shadow: 0 6px 0 #2563eb; display: none; }
        .btn-next:hover { background: #2563eb; box-shadow: 0 4px 0 #1d4ed8; }
        .btn-next:active { box-shadow: 0 0 0 #1d4ed8; }

        .feedback {
            font-size: 1.6em;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }
        .score-board {
            font-size: 1.3em;
            color: #ef4444;
            font-weight: bold;
            margin-top: 20px;
            background: #fee2e2;
            padding: 10px;
            border-radius: 15px;
            display: inline-block;
        }
        .confetti { position: fixed; z-index: 9999; pointer-events: none; transition: all 1.5s ease-out; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎈 Làm Toán Cùng Bố 🎈</h1>
        
        <div class="modes">
            <button class="mode-btn active" onclick="setMode('all', this)">Trộn lẫn ngẫu nhiên</button>
            <button class="mode-btn" onclick="setMode('basic', this)">Tính nhanh</button>
            <button class="mode-btn" onclick="setMode('missing', this)">Tìm số bí ẩn</button>
            <button class="mode-btn" onclick="setMode('word', this)">Toán đố</button>
        </div>

        <div class="question-box" id="question">Đang tải câu hỏi...</div>

        <div class="input-area">
            <input type="number" id="answer" placeholder="?" onkeypress="handleEnter(event)">
        </div>

        <button class="btn" id="btn-submit" onclick="checkAnswer()">Trả lời nhé!</button>
        <button class="btn btn-next" id="btn-next" onclick="generateQuestion()">Câu tiếp theo ➔</button>

        <div class="feedback" id="feedback"></div>
        <div class="score-board">Điểm của con: ⭐ <span id="score">0</span></div>
    </div>

    <script>
        let score = 0;
        let currentAnswer = 0;
        let currentMode = 'all';

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function setMode(mode, btnElement) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            generateQuestion();
            document.getElementById('answer').focus();
        }

        function generateQuestion() {
            document.getElementById('answer').value = '';
            document.getElementById('answer').disabled = false;
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('btn-submit').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('answer').focus();
            
            let type = currentMode;
            if (type === 'all') {
                type = pick(['basic', 'missing', 'word']);
            }

            let result = { q: '', a: 0 };

            if (type === 'basic') {
                result = genBasicMath();
            } else if (type === 'missing') {
                result = genMissingMath();
            } else if (type === 'word') {
                result = genWordProblem();
            }

            currentAnswer = result.a;
            document.getElementById('question').innerText = result.q;
        }

        // TẠO PHÉP TÍNH 2 HOẶC 3 SỐ
        function genBasicMath() {
            let isThree = Math.random() > 0.4; // 60% khả năng ra 3 số
            let a = rand(5, 60);
            let ans = a;
            let q = `${a}`;

            let op1 = Math.random() > 0.5 ? '+' : '-';
            let b = rand(5, op1 === '+' ? 100 - a : a);
            ans = op1 === '+' ? ans + b : ans - b;
            q += ` ${op1} ${b}`;

            if (isThree) {
                let op2 = Math.random() > 0.5 ? '+' : '-';
                // Đảm bảo kết quả phép tính 3 số không bị âm và không quá 100
                let c = rand(2, op2 === '+' ? 100 - ans : ans);
                ans = op2 === '+' ? ans + c : ans - c;
                q += ` ${op2} ${c}`;
            }

            return { q: `${q} = ?`, a: ans };
        }

        // TẠO BÀI TOÁN TÌM SỐ BÍ ẨN (X)
        function genMissingMath() {
            let isThree = Math.random() > 0.4; 
            let a = rand(5, 50);
            let ans = a;
            let elements = [a];
            let ops = [];

            let op1 = Math.random() > 0.5 ? '+' : '-';
            let b = rand(5, op1 === '+' ? 100 - a : a);
            ans = op1 === '+' ? ans + b : ans - b;
            elements.push(b);
            ops.push(op1);

            if (isThree) {
                let op2 = Math.random() > 0.5 ? '+' : '-';
                let c = rand(2, op2 === '+' ? 100 - ans : ans);
                ans = op2 === '+' ? ans + c : ans - c;
                elements.push(c);
                ops.push(op2);
            }

            // Chọn ngẫu nhiên 1 vị trí để biến thành "..."
            let hideIdx = rand(0, elements.length - 1);
            let hiddenVal = elements[hideIdx];
            elements[hideIdx] = '...';

            let qText = `${elements[0]}`;
            for(let i = 0; i < ops.length; i++){
                qText += ` ${ops[i]} ${elements[i+1]}`;
            }
            qText += ` = ${ans}`;

            return { q: qText, a: hiddenVal };
        }

        // TẠO TOÁN ĐỐ 5 DẠNG KHÁC NHAU
        function genWordProblem() {
            const names = ["Nga", "Linh", "Minh", "Lan", "Hải", "An", "Bảo", "Chi", "Hương", "Long"];
            const items = ["quả cam", "quả táo", "viên bi", "cái kẹo", "quyển vở", "bông hoa", "chiếc bút"];

            let n1 = pick(names), n2 = pick(names);
            while(n1 === n2) n2 = pick(names);
            let item = pick(items);

            let kieuBai = rand(1, 5);
            let qText = "";
            let ans = 0;

            if (kieuBai === 1) { 
                // Dạng 1: Cho tổng C, A có X. Hỏi B có bao nhiêu?
                let x = rand(10, 50);
                let y = rand(10, 50);
                let c = x + y;
                ans = y;
                qText = `Hai bạn ${n1} và ${n2} có tất cả ${c} ${item}. Bạn ${n1} có ${x} ${item}. Hỏi bạn ${n2} có bao nhiêu ${item}?`;
            } else if (kieuBai === 2) { 
                // Dạng 2: A có X, B nhiều hơn Y.
                let x = rand(10, 50);
                let y = rand(5, 30);
                ans = x + y;
                qText = `Bạn ${n1} có ${x} ${item}. Bạn ${n2} có nhiều hơn bạn ${n1} ${y} ${item}. Hỏi bạn ${n2} có bao nhiêu ${item}?`;
            } else if (kieuBai === 3) { 
                // Dạng 3: A có X, B ít hơn Y.
                let x = rand(20, 70);
                let y = rand(5, x - 5);
                ans = x - y;
                qText = `Bạn ${n1} có ${x} ${item}. Bạn ${n2} có ít hơn bạn ${n1} ${y} ${item}. Hỏi bạn ${n2} có bao nhiêu ${item}?`;
            } else if (kieuBai === 4) { 
                // Dạng 4: Cộng 2 số bình thường
                let x = rand(10, 40);
                let y = rand(10, 40);
                ans = x + y;
                qText = `Bạn ${n1} có ${x} ${item}, bạn ${n2} có ${y} ${item}. Hỏi cả hai bạn có tất cả bao nhiêu ${item}?`;
            } else if (kieuBai === 5) { 
                // Dạng 5: Trừ đi
                let x = rand(20, 60);
                let y = rand(5, x - 5);
                ans = x - y;
                qText = `Bạn ${n1} có ${x} ${item}. ${n1} cho bạn ${n2} ${y} ${item}. Hỏi bạn ${n1} còn lại bao nhiêu ${item}?`;
            }
            return { q: qText, a: ans };
        }

        function checkAnswer() {
            let userAnswer = parseInt(document.getElementById('answer').value);
            let feedbackEl = document.getElementById('feedback');
            
            if (isNaN(userAnswer)) {
                feedbackEl.innerText = "Con hãy nhập một số nhé! 🤔";
                feedbackEl.style.color = "#f59e0b";
                return;
            }

            if (userAnswer === currentAnswer) {
                feedbackEl.innerText = "Chính xác! Hoan hô con! 🎉";
                feedbackEl.style.color = "#16a34a";
                score += 10;
                document.getElementById('score').innerText = score;
                document.getElementById('answer').disabled = true; 
                
                document.getElementById('btn-submit').style.display = 'none';
                document.getElementById('btn-next').style.display = 'inline-block';
                document.getElementById('btn-next').focus();

                shootConfetti(); 
            } else {
                feedbackEl.innerText = "Chưa đúng rồi, con tính lại thử xem! 💪";
                feedbackEl.style.color = "#ef4444";
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
                
                if (score > 0) score -= 2;
                document.getElementById('score').innerText = score;
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('btn-submit').style.display !== 'none') checkAnswer();
                else generateQuestion();
            }
        }

        function shootConfetti() {
            const emojis = ['🌟', '⭐', '✨', '🎉', '🎊', '🍎', '🎈', '🏆'];
            for(let i = 0; i < 25; i++) {
                let el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.className = 'confetti';
                
                el.style.left = (Math.random() * 100) + 'vw';
                el.style.top = '100vh';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                
                document.body.appendChild(el);
                
                setTimeout(() => {
                    el.style.top = '-' + (Math.random() * 20 + 10) + 'vh';
                    el.style.transform = `rotate(${Math.random() * 720 - 360}deg)`;
                }, 50);
                
                setTimeout(() => el.remove(), 1500);
            }
        }

        window.onload = generateQuestion;
    </script>
</body>
</html>
